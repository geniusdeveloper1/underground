<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171a20"><title>Underground — Security & tech community</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#feed"><span class="brand-mark">U</span><span>underground</span></a>
    <button class="new-post side-new" id="sidebar-new">＋ New post</button>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="#feed" data-nav="feed" class="nav-link active"><span class="nav-icon">▤</span> Community feed</a>
      <a href="#saved" data-nav="saved" class="nav-link"><span class="nav-icon">◇</span> Saved posts</a>
    </nav>
    <div class="side-heading"><span>YOUR DISCUSSIONS</span><span class="side-count" id="discussion-count">0</span></div>
    <div class="discussion-list" id="discussion-list"></div>
    <div class="sidebar-bottom">
      <div class="user-avatar" id="user-avatar">U</div>
      <div class="user-label"><strong id="sidebar-name">Member</strong><small id="sidebar-status">Local preview</small></div>
      <button class="more" id="account-menu-button" aria-label="Account menu" aria-expanded="false">···</button>
      <div class="account-menu" id="account-menu" hidden>
        <button type="button" id="open-settings">Settings</button>
        <button type="button" id="edit-profile">Edit profile</button>
      </div>
    </div>
  </aside>
  <main class="main-area">
    <header class="topbar"><div class="mobile-brand"><span class="brand-mark">U</span> underground</div><div class="breadcrumb" id="breadcrumb">Community / Feed</div><div class="top-actions"><span class="status-dot"></span> Community space</div></header>
    <div id="view" class="view" aria-live="polite"></div>
    <footer class="footer">Underground <span>·</span> Learn, share and build together. <a href="#rules">House rules</a></footer>
  </main>
</div>
<script src="app.js"></script>
</body></html>
